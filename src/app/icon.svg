<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d16" />
      <stop offset="100%" stop-color="#050e0b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="airBreeze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with smooth rounded corners and subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Clean Air Flow Vortex Upper Arc -->
  <path d="M14 26 C22 18, 38 18, 48 24 C52 26, 53 30, 49 32 C46 34, 42 32, 40 30 C33 24, 23 25, 17 31 C15 33, 12 32, 12 29 C12 27, 13 26, 14 26 Z" 
        fill="url(#airBreeze)" opacity="0.85" />

  <!-- Main Clean Botanical Leaf (representing pure filtered air & nature) -->
  <path d="M22 47 C20 37, 24 25, 36 17 C48 9, 53 12, 51 22 C49 34, 38 45, 22 47 Z" 
        fill="url(#leafGrad)" />

  <!-- Leaf Central Vein & Oxygen Streamline -->
  <path d="M23 46 C30 39, 36 32, 44 23" 
        stroke="#042f20" stroke-width="2.5" stroke-linecap="round" />
  
  <path d="M32 35 C36 34, 41 36, 44 38" 
        stroke="#042f20" stroke-width="1.8" stroke-linecap="round" />

  <!-- Secondary Lower Breeze Streamline (Purified Air Outflow) -->
  <path d="M11 39 C18 35, 27 36, 33 40 C35 41, 35 43, 33 44 C31 45, 29 44, 27 42 C22 39, 16 39, 12 43 C10 44, 9 43, 9 41 C9 40, 10 39, 11 39 Z" 
        fill="url(#airBreeze)" opacity="0.9" />

  <!-- Glowing Purity Dot -->
  <circle cx="48" cy="17" r="2.5" fill="#a7f3d0" filter="url(#glow)" />
</svg>
